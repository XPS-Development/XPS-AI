[project]
name = "ai-xps"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lmfit==1.3.4",
    "numpy==2.3.2",
    "onnxruntime==1.22.1",
    "pyqtgraph==0.14.0",
    "pyside6==6.10.2",
    "pyside6-addons==6.10.2",
    "pyside6-essentials==6.10.2",
    "scipy==1.16.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-benchmark>=5.2.3",
    "ruff>=0.16.3",
    "ty>=0.0.72",
    "viztracer>=1.1.1",
]
interactive = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
]

[tool.pytest]
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "core", "ui", "tools", "tests"]
extend-exclude = ["model", "notebooks"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "ANN",  # type annotations
    "D",    # docstrings
    "RUF",  # ruff-specific
    "TC",   # TYPE_CHECKING blocks
    "PT",   # pytest
]
ignore = [
    "ANN002",  # *args
    "ANN003",  # **kwargs
    "TC006",   # quoted types in isinstance/cast (noisy with from __future__ import annotations)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"**/test_*.py" = ["D", "ANN"]
"ui/**" = ["ANN401"]
"tools/serialization.py" = ["ANN401"]
"app/json_utils.py" = ["ANN401"]
"tools/converters/**" = ["ANN", "D"]
"tools/parsers/specs.py" = ["ANN", "D"]
"tools/parsers/vamas.py" = ["ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["app", "core", "ui", "tools"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.src]
exclude = ["model/**", "tools/converters/**"]

[tool.ty.rules]
unresolved-import = "ignore"
